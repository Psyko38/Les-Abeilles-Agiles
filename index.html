<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Les Abeilles Agiles — Nos ateliers</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="phone">
    <header class="topbar" id="topbar"></header>

    <main id="app" aria-label="Contenu principal">
      <section class="view" id="view-list" aria-label="Liste des ateliers" hidden>
        <div class="hero">
          <h1>Nos Ateliers</h1>
          <p>Trouver une activité</p>
        </div>
        <div class="cards" id="list-cards"></div>
      </section>

      <section class="view" id="view-detail" aria-label="Fiche atelier" hidden>
        <div class="detail-main" id="detail-cards"></div>
        <div class="detail-side">
          <div class="card" id="session-card"></div>
          <button class="btn" id="btn-reserve-session" type="button">Réserver cette séance</button>
        </div>
      </section>

      <section class="view" id="view-reservation" aria-label="Formulaire de réservation" hidden>
        <div class="reserv-main">
          <div class="card">
            <h2>Séance choisie</h2>
            <p id="chosen-session"></p>
            <form id="reservation-form" aria-label="Formulaire de réservation" novalidate>
              <label for="prenom">Prénom</label>
              <input type="text" id="prenom" name="prenom" autocomplete="given-name" maxlength="100" aria-describedby="err-prenom" required>
              <p class="field-error" id="err-prenom" role="alert" hidden></p>

              <label for="nom">Nom</label>
              <input type="text" id="nom" name="nom" autocomplete="family-name" maxlength="100" aria-describedby="err-nom" required>
              <p class="field-error" id="err-nom" role="alert" hidden></p>

              <label for="age">Âge</label>
              <p class="hint" id="age-hint"></p>
              <input type="number" id="age" name="age" min="1" max="120" inputmode="numeric" aria-describedby="age-hint err-age" required>
              <p class="field-error" id="err-age" role="alert" hidden></p>

              <label for="email">E-mail</label>
              <input type="email" id="email" name="email" autocomplete="email" maxlength="100" aria-describedby="err-email" required>
              <p class="field-error" id="err-email" role="alert" hidden></p>
            </form>
          </div>
        </div>

        <div class="reserv-aside">
          <p class="card notice" role="note">Si vous avez moins de 18 ans, apportez une autorisation parentale.</p>
          <button class="btn" id="btn-confirm" type="button">Confirmer la réservation</button>
        </div>
      </section>

      <section class="view" id="view-success" aria-label="Confirmation de réservation" hidden>
        <div class="card success" role="status">
          <h2>Réservation confirmée</h2>
          <p id="success-summary"></p>
        </div>
        <button class="btn" id="btn-back-home" type="button">Voir les autres ateliers</button>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
